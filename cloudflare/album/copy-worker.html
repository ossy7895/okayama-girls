<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>アルバム用Workerコードのコピー</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172033;font-family:system-ui,-apple-system,sans-serif;line-height:1.7}main{max-width:620px;margin:0 auto;padding:28px 18px}section{background:white;border-radius:20px;padding:24px;box-shadow:0 3px 20px #1420330b}h1{font-size:21px;line-height:1.5;margin:0 0 12px}p{font-size:14px;margin:12px 0}button{width:100%;border:0;border-radius:13px;min-height:58px;padding:14px;background:#c8102e;color:white;font-size:17px;font-weight:800;cursor:pointer}button:disabled{background:#9ca3af;cursor:wait}#status{min-height:48px;font-size:14px;font-weight:700;overflow-wrap:anywhere}.hint{color:#667085;font-size:12px}textarea{width:100%;min-height:190px;font-size:12px;line-height:1.5;border:1px solid #ccd2dd;border-radius:10px;padding:10px}details{margin-top:20px}summary{font-size:13px;cursor:pointer}a{color:#b10e29}
  </style>
</head>
<body>
  <main><section>
    <h1>アルバム用Workerコード</h1>
    <p>下のボタンを押すと、置き換え用のコード全体をコピーできます。</p>
    <button id="copy" type="button" disabled>コードを読み込み中…</button>
    <p id="status" role="status" aria-live="polite">読み込み中です。</p>
    <p>コピー後はCloudflareの編集画面へ戻り、左側のコードをすべて選択して貼り付けます。</p>
    <p><a href="https://dash.cloudflare.com/3bd542e7bae0098bc3ca9b221ed575b3/workers/services/edit/white-leaf-338b/production">Cloudflareの編集画面へ戻る</a></p>
    <details id="manual"><summary>手動でコピーする場合</summary><p class="hint">コード欄を長押しし「すべて選択」→「コピー」を選んでください。</p><textarea id="code" readonly spellcheck="false" aria-label="Workerコード全体"></textarea></details>
    <p class="hint">公開リポジトリのWorkerソースをコピーするためのページです。秘密鍵は含まれていません。このページからCloudflareの設定やチームのデータを書き換えることはありません。</p>
  </section></main>
  <script>
    'use strict';
    const button=document.getElementById('copy'),status=document.getElementById('status'),area=document.getElementById('code');let code='';
    button.addEventListener('click',async()=>{
      if(!code)return;
      try{
        await navigator.clipboard.writeText(code);
        status.textContent='コード全体をコピーしました。Cloudflareの編集画面へ戻ってください。';button.textContent='もう一度コピーする';
      }catch{
        const manual=document.getElementById('manual');manual.open=true;area.focus();area.select();area.setSelectionRange(0,area.value.length);
        status.textContent='下のコード欄で「コピー」を選んでください。';
      }
    });
    (async()=>{
      try{
        const response=await fetch('./worker.mjs?copy='+Date.now(),{cache:'no-store',credentials:'omit'});
        if(!response.ok)throw new Error('load_failed');
        const text=await response.text();
        if(!text.includes('async function deleteMedia(')||!text.includes('mediaDeletion:true')||!text.includes('export default'))throw new Error('unexpected_source');
        code=text;area.value=text;button.disabled=false;button.textContent='コード全体をコピー';status.textContent='タイトル編集・フォルダ・削除機能に対応したコードを読み込みました。';
      }catch{
        status.textContent='コードを読み込めませんでした。このページを再読み込みしてください。';button.textContent='読み込みできませんでした';
      }
    })();
  </script>
</body>
</html>
